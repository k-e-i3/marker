<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虫食 v5.8.0</title>
    <style>
        :root {
            --bg-color: #f8fafc; --main-bg: #ffffff;
            --text-color: #1e293b; --border-color: #cbd5e0;
            --header-bg: #0f172a; --header-text: #ffffff;
            --button-bg: #334155; --button-hover-bg: #1e293b;
            --highlight-bg: #fffde7; --toolbar-bg: #f1f5f9;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; height: 100vh; width: 100vw;
        }
        #app-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
        header {
            background-color: var(--header-bg); color: var(--header-text);
            padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 54px;
        }
        .doc-controls { display: flex; flex-grow: 1; gap: 6px; align-items: center; overflow: hidden; }
        select#doc-select {
            flex-grow: 1; height: 38px; font-size: 16px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; min-width: 80px;
        }
        button.icon-btn {
            height: 38px; width: 42px; display: flex; justify-content: center; align-items: center;
            background-color: var(--button-bg); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0;
        }
        .meta-info { text-align: right; line-height: 1.2; margin-left: auto; display: flex; flex-direction: column; justify-content: center; min-width: 60px; }
        #char-counter { font-size: 10px; color: #ffffff; font-weight: bold; white-space: nowrap; }
        #save-status { font-size: 8px; color: #94a3b8; white-space: nowrap; }
        
        #toolbar-container {
            background-color: var(--toolbar-bg); padding: 8px; border-bottom: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .action-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .action-btn {
            background: #fff; border: 1px solid #cbd5e0; color: #334155;
            font-size: 13px; padding: 0 12px; border-radius: 6px; cursor: pointer; height: 36px; white-space: nowrap;
            transition: all 0.2s; flex-shrink: 0;
        }
        .marker-scroll-row { 
            display: flex; gap: 10px; overflow-x: auto; padding: 4px 0; 
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap; 
        }
        .palette-btn {
            width: 44px; height: 42px; flex-shrink: 0; border-radius: 8px; cursor: pointer; 
            border: 2px solid rgba(0,0,0,0.15); box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        main { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; position: relative; background: var(--main-bg); }
        #main-text-area {
            flex-grow: 1; padding: 20px; font-size: 18px; line-height: 1.8;
            white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; outline: none;
            -webkit-user-modify: read-write-plaintext-only;
        }
        #main-text-area:empty::before { content: "文章を入力してください..."; color: #94a3b8; }
        
        .panel.manager {
            flex-shrink: 0; border-top: 1px solid var(--border-color); background: #f8fafc;
            height: 35vh; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
        }
        .panel.manager.closed { height: 42px; }
        .panel-header {
            padding: 0 12px; height: 42px; display: flex; align-items: center; justify-content: space-between;
            background-color: #f1f5f9; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 1px solid #e2e8f0;
        }
        #marker-manager-list { overflow-y: auto; flex-grow: 1; padding: 8px; }
        .manager-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #e2e8f0; background: #fff; gap: 12px; border-radius: 4px; margin-bottom: 4px; }
        .manager-item-text { flex-grow: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .manager-item-delete { border: 1px solid #fca5a5; background: #fee2e2; color: #dc2626; width: 40px; height: 38px; border-radius: 6px; font-size: 20px; cursor: pointer; }
        
        .marker { 
            cursor: pointer; border-radius: 2px; user-select: none; transition: all 0.2s; padding: 0 2px; margin: 0 1px;
            display: inline-block; line-height: 1.2; border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .marker[data-color="red"] { background-color: #ef4444; color: #ef4444; }
        .marker[data-color="orange"] { background-color: #f97316; color: #f97316; }
        .marker[data-color="yellow"] { background-color: #eab308; color: #eab308; }
        .marker[data-color="green"] { background-color: #22c55e; color: #22c55e; }
        .marker[data-color="blue"] { background-color: #3b82f6; color: #3b82f6; }
        .marker[data-color="purple"] { background-color: #a855f7; color: #a855f7; }
        .marker.reveal { background-color: var(--highlight-bg) !important; color: var(--text-color) !important; border-bottom: 2px solid transparent; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 9999; display: none; justify-content: center; align-items: center;
        }
        .modal-content { 
            background: #fff; width: 92%; max-width: 480px; border-radius: 12px; padding: 24px; 
            display: flex; flex-direction: column; gap: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
        }
        #sync-id-input, #rename-input {
            width: 100%; height: 44px; border: 1px solid #cbd5e0; border-radius: 8px; 
            padding: 0 12px; font-weight: bold; font-size: 20px; -webkit-appearance: none;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <header>
            <div class="doc-controls">
                <select id="doc-select" aria-label="文書選択"></select>
                <button id="rename-doc-btn" class="icon-btn" title="名前変更">✎</button>
                <button id="cloud-load-btn" class="icon-btn" title="同期読込" style="background:#2563eb;">☁</button>
                <button id="manual-save-btn" class="icon-btn" title="同期保存" style="background:#059669;">💾</button>
                <button id="sync-setup-btn" class="icon-btn" title="設定" style="background:#d97706;">🔑</button>
            </div>
            <div class="meta-info">
                <div id="char-counter">0文字</div>
                <div id="save-status">Connecting...</div>
            </div>
        </header>

        <div id="toolbar-container">
            <div class="action-row">
                <button class="action-btn" id="paste-btn">📋 貼付</button>
                <button class="action-btn" id="speech-btn" style="min-width: 90px; font-weight: bold; border-color: #3b82f6; color: #2563eb;">▶ 読上</button>
                <select id="speech-rate-select" class="action-btn" aria-label="速度">
                    <option value="0.6">0.6x</option>
                    <option value="0.8">0.8x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.2">1.2x</option>
                    <option value="1.5">1.5x</option>
                </select>
                <button class="action-btn" id="copy-btn">📄 コピー</button>
                <label class="action-btn" style="margin-left:auto; display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="toggle-markers-cb" checked> 隠す
                </label>
            </div>
            <div class="marker-scroll-row" id="marker-palette"></div>
        </div>

        <main>
            <div id="main-text-area" contenteditable="true" spellcheck="false" aria-label="入力"></div>
            <div class="panel manager closed" id="manager-panel">
                <div class="panel-header" id="manager-header" role="button">
                    <span>虫食箇所一覧</span>
                    <span id="toggle-manager-icon">▲</span>
                </div>
                <div id="marker-manager-list"></div>
            </div>
        </main>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0; color: #1e293b;">同期設定</h3>
            <div id="sync-view">
                <p style="font-size:13px; color:#475569;">同期用IDを入力（例: 513042042）:</p>
                <input type="text" id="sync-id-input" placeholder="番号を入力">
                <p style="font-size:11px; color:#64748b; margin-top: 8px;">※他のブラウザでも同じ数字を入力すれば共通の文章を同期できます。</p>
            </div>
            <div id="rename-view" style="display:none;">
                <p style="font-size:13px; color:#475569;">文書名の変更:</p>
                <input type="text" id="rename-input" placeholder="名前を入力">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 10px;">
                <button class="action-btn" id="modal-ok-btn" style="background:#2563eb; color:white; border:none; min-width:80px;">決定</button>
                <button class="action-btn" id="modal-cancel-btn" style="min-width:80px;">閉じる</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const fbConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mushikui-tool-v5';
        let db, auth, currentUser;

        class MushikuiToolV5 {
            constructor() {
                const savedId = localStorage.getItem('user_numeric_id');
                this.state = {
                    appData: { documents: Array.from({length:20}, (_,i)=>({title:`文章 ${i+1}`, content:''})), rules: '' },
                    currentDocIndex: 0,
                    syncId: savedId || null,
                    isSpeaking: false,
                    lastSpeechIndex: 0,
                    fullTextForSpeech: ""
                };
                this.resumeTimer = null;
                this.lastTapTime = 0;
                this.lastTapTarget = null;
                this.colors = [
                    { id: 'red', code: '#ef4444' }, { id: 'orange', code: '#f97316' },
                    { id: 'yellow', code: '#eab308' }, { id: 'green', code: '#22c55e' },
                    { id: 'blue', code: '#3b82f6' }, { id: 'purple', code: '#a855f7' }
                ];
            }

            async init() {
                this.editor = document.getElementById('main-text-area');
                this.docSelect = document.getElementById('doc-select');
                this.saveStatus = document.getElementById('save-status');
                this.charCounter = document.getElementById('char-counter');
                this.speechBtn = document.getElementById('speech-btn');
                
                this.performMigration(); 
                this.renderPalette();
                this.bindEvents();

                if (!fbConfig) {
                    this.showStatus("Offline Mode");
                    this.refresh();
                    return;
                }

                try {
                    const appInstance = initializeApp(fbConfig);
                    auth = getAuth(appInstance);
                    db = getFirestore(appInstance);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, async (u) => {
                        currentUser = u;
                        if (u) {
                            if(!this.state.syncId) this.state.syncId = u.uid;
                            this.updateIdBadge();
                            if (localStorage.getItem('user_numeric_id')) {
                                await this.loadCloud(false);
                            }
                            this.refresh();
                        }
                    });
                } catch(e) {
                    // net::ERR_BLOCKED_BY_CLIENT の場合、ここを通ります
                    this.showStatus("通信遮断(Brave Shield等)");
                    this.refresh();
                }
            }

            performMigration() {
                const keys = ['memorize_v5_stable', 'marker_v4_final'];
                let masterData = this.state.appData;
                for(const k of keys) {
                    const s = localStorage.getItem(k);
                    if(!s) continue;
                    try {
                        const d = JSON.parse(s);
                        if(d && d.documents) {
                            if(JSON.stringify(d).length > JSON.stringify(masterData).length) masterData = d;
                        }
                    } catch(e) {}
                }
                this.state.appData = masterData;
                this.persistLocal();
            }

            updateIdBadge() {
                if(this.saveStatus) {
                    const idText = this.state.syncId || "未設定";
                    this.saveStatus.textContent = `ID: ${idText.substring(0,12)}`;
                }
            }

            renderPalette() {
                const p = document.getElementById('marker-palette');
                if(!p) return;
                p.innerHTML = '';
                this.colors.forEach(c => {
                    const btn = document.createElement('div');
                    btn.className = 'palette-btn';
                    btn.style.backgroundColor = c.code;
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        this.createMarker(c.id);
                    });
                    p.appendChild(btn);
                });
            }

            bindEvents() {
                this.editor.addEventListener('input', () => {
                    this.state.appData.documents[this.state.currentDocIndex].content = this.editor.innerText;
                    this.autoPersist();
                });
                this.editor.addEventListener('click', (e) => {
                    const m = e.target.closest('.marker');
                    if (m) {
                        const now = Date.now();
                        if (now - this.lastTapTime < 350 && this.lastTapTarget === m) {
                            if(confirm("この虫食を削除しますか？")) this.delRule(m.dataset.rule);
                            this.lastTapTime = 0; this.lastTapTarget = null;
                        } else {
                            m.classList.toggle('reveal');
                            this.lastTapTime = now; this.lastTapTarget = m;
                        }
                    }
                });
                this.docSelect.addEventListener('change', (e) => {
                    this.state.appData.documents[this.state.currentDocIndex].content = this.editor.innerText;
                    this.state.currentDocIndex = parseInt(e.target.value);
                    this.state.lastSpeechIndex = 0; 
                    this.refresh();
                });
                document.getElementById('rename-doc-btn').onclick = () => this.openRename();
                document.getElementById('cloud-load-btn').onclick = () => this.loadCloud(true);
                document.getElementById('manual-save-btn').onclick = () => this.saveCloud(true);
                document.getElementById('sync-setup-btn').onclick = () => this.openSyncSetup();
                document.getElementById('manager-header').onclick = () => {
                    document.getElementById('manager-panel').classList.toggle('closed');
                };
                this.speechBtn.onclick = () => this.toggleSpeech();
                document.getElementById('copy-btn').onclick = () => { 
                    navigator.clipboard.writeText(this.editor.innerText);
                    this.showStatus("本文コピー完了");
                };
                document.getElementById('toggle-markers-cb').onchange = (e) => this.toggleVisibility(e.target.checked);
                document.getElementById('modal-cancel-btn').onclick = () => {
                    document.getElementById('modal-overlay').style.display = 'none';
                };
            }

            createMarker(colorId) {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
                const range = sel.getRangeAt(0);
                const target = range.toString().trim();
                if (!target) return;

                const getCtx = (isPre) => {
                    const r = document.createRange();
                    if(isPre) { r.setStart(this.editor, 0); r.setEnd(range.startContainer, range.startOffset); }
                    else { r.setStart(range.endContainer, range.endOffset); r.setEnd(this.editor, this.editor.childNodes.length); }
                    const txt = r.cloneContents().textContent || "";
                    return isPre ? [...txt].slice(-4).join('') : [...txt].slice(0, 4).join('');
                };

                const rule = `${this.state.currentDocIndex}::${getCtx(true)}[SEP]${getCtx(false)}->${target}%%C${colorId}`;
                const rs = (this.state.appData.rules || '').split('\n').filter(Boolean);
                rs.push(rule);
                this.state.appData.rules = rs.join('\n');
                this.refresh();
                this.persistLocal();
                sel.removeAllRanges();
            }

            refresh() {
                const raw = this.state.appData.documents[this.state.currentDocIndex].content || '';
                this.editor.innerHTML = '';
                let nodes = [{ text: raw, type: 'text' }];
                const rules = (this.state.appData.rules || '').split('\n').filter(r => r.trim() && r.startsWith(this.state.currentDocIndex + '::'));
                
                rules.forEach(rule => {
                    if (!rule.includes('->') || !rule.includes('%%')) return;
                    const [meta, body] = rule.split('->');
                    const [target, colorPart] = body.split('%%');
                    const colorId = colorPart.startsWith('C') ? colorPart.substring(1) : 'red';
                    const preSec = meta.split('::')[1];
                    if(!preSec) return;
                    const pre = preSec.split('[SEP]')[0] || "";
                    const pattern = pre + target;
                    
                    for (let i = 0; i < nodes.length; i++) {
                        if (nodes[i].type === 'text') {
                            const idx = nodes[i].text.indexOf(pattern);
                            if (idx > -1) {
                                const start = idx + pre.length;
                                nodes.splice(i, 1, 
                                    { text: nodes[i].text.substring(0, start), type: 'text' },
                                    { text: target, type: 'marker', color: colorId, rule: rule },
                                    { text: nodes[i].text.substring(start + target.length), type: 'text' }
                                );
                                break;
                            }
                        }
                    }
                });

                nodes.forEach(n => {
                    if (n.type === 'text') {
                        n.text.split('\n').forEach((t, i, a) => {
                            if(t) this.editor.appendChild(document.createTextNode(t));
                            if(i < a.length - 1) this.editor.appendChild(document.createElement('br'));
                        });
                    } else {
                        const span = document.createElement('span');
                        span.className = 'marker';
                        span.dataset.text = n.text; span.dataset.rule = n.rule; span.dataset.color = n.color;
                        span.textContent = n.text; this.editor.appendChild(span);
                    }
                });
                this.renderManager(rules);
                this.updateMeta();
                this.toggleVisibility(document.getElementById('toggle-markers-cb').checked);
            }

            renderManager(rules) {
                const list = document.getElementById('marker-manager-list');
                if(!list) return;
                list.innerHTML = rules.length ? '' : '<p style="text-align:center;color:#94a3b8;padding:10px;">なし</p>';
                rules.forEach(r => {
                    if(!r.includes('->')) return;
                    const parts = r.split('->')[1].split('%%');
                    const colorName = parts[1].replace('C', '');
                    const code = this.colors.find(c => c.id === colorName)?.code || '#ef4444';
                    const item = document.createElement('div');
                    item.className = 'manager-item';
                    item.innerHTML = `<div style="width:20px;height:20px;background:${code};border-radius:3px"></div><div class="manager-item-text">${parts[0]}</div><button class="manager-item-delete">×</button>`;
                    item.querySelector('.manager-item-delete').onclick = (e) => { 
                        e.stopPropagation(); 
                        this.delRule(r); 
                    };
                    item.onclick = () => {
                        const el = Array.from(this.editor.querySelectorAll('.marker')).find(m => m.dataset.rule === r);
                        if(el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('reveal'); }
                    };
                    list.appendChild(item);
                });
            }

            autoPersist() {
                this.persistLocal();
                clearTimeout(this.cloudTimer);
                this.cloudTimer = setTimeout(() => this.saveCloud(false), 8000);
            }

            persistLocal() {
                localStorage.setItem('memorize_v5_stable', JSON.stringify(this.state.appData));
            }

            async saveCloud(manual = false) {
                if (!db || !this.state.syncId || !currentUser) {
                    if(manual) this.showStatus("接続遮断:Shields等を確認");
                    return;
                }
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_storage', this.state.syncId);
                    await setDoc(docRef, { ...this.state.appData, lastUpdated: new Date().toISOString() });
                    if(manual) this.showStatus("保存完了");
                } catch(e) { this.showStatus("保存失敗"); }
            }

            async loadCloud(manual = true) {
                if (!db || !this.state.syncId || !currentUser) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_storage', this.state.syncId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) { 
                        const data = snap.data();
                        if(data && data.documents) {
                            this.state.appData = data; this.refresh();
                            if(manual) this.showStatus("同期完了");
                        }
                    } else if(manual) {
                        this.showStatus("クラウドにデータなし");
                    }
                } catch(e) { this.showStatus("読込失敗"); }
            }

            showStatus(msg) {
                if(this.saveStatus) {
                    this.saveStatus.textContent = msg;
                    setTimeout(() => { this.updateIdBadge(); }, 4000);
                }
            }

            openSyncSetup() {
                const m = document.getElementById('modal-overlay');
                document.getElementById('rename-view').style.display = 'none';
                document.getElementById('sync-view').style.display = 'block';
                m.style.display = 'flex';
                document.getElementById('sync-id-input').value = this.state.syncId || "";
                document.getElementById('modal-ok-btn').onclick = async () => {
                    const nid = document.getElementById('sync-id-input').value.trim();
                    if(nid.length > 0) { 
                        this.state.syncId = nid; 
                        localStorage.setItem('user_numeric_id', nid);
                        this.updateIdBadge(); 
                        if (db && currentUser) await this.loadCloud(false); 
                        this.refresh();
                    }
                    m.style.display = 'none';
                };
            }

            openRename() {
                const m = document.getElementById('modal-overlay');
                document.getElementById('sync-view').style.display = 'none';
                document.getElementById('rename-view').style.display = 'block';
                m.style.display = 'flex';
                const input = document.getElementById('rename-input');
                input.value = this.state.appData.documents[this.state.currentDocIndex].title;
                document.getElementById('modal-ok-btn').onclick = () => {
                    this.state.appData.documents[this.state.currentDocIndex].title = input.value;
                    this.updateMeta(); this.persistLocal(); m.style.display = 'none';
                };
            }

            updateMeta() {
                if(this.charCounter) this.charCounter.textContent = `${this.editor.innerText.length}文字`;
                if(this.docSelect) {
                    this.docSelect.innerHTML = this.state.appData.documents.map((d,i) => `<option value="${i}">${d.title}</option>`).join('');
                    this.docSelect.value = this.state.currentDocIndex;
                }
            }

            delRule(r) {
                const rs = (this.state.appData.rules || '').split('\n');
                const idx = rs.indexOf(r);
                if (idx > -1) { rs.splice(idx, 1); this.state.appData.rules = rs.join('\n'); this.refresh(); this.persistLocal(); }
            }

            toggleVisibility(hide) {
                this.editor.querySelectorAll('.marker').forEach(m => {
                    if (hide) m.classList.remove('reveal'); else m.classList.add('reveal');
                });
            }

            toggleSpeech() {
                if (this.state.isSpeaking) {
                    if (this.resumeTimer) { clearInterval(this.resumeTimer); this.resumeTimer = null; }
                    window.speechSynthesis.cancel();
                    this.state.isSpeaking = false;
                    this.speechBtn.textContent = "▶ 続きから";
                    return;
                }
                const currentFullText = this.editor.innerText;
                if (!currentFullText.trim()) return;
                if (this.state.fullTextForSpeech !== currentFullText) {
                    this.state.lastSpeechIndex = 0;
                    this.state.fullTextForSpeech = currentFullText;
                }
                const textToSpeak = currentFullText.substring(this.state.lastSpeechIndex);
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume(); 
                const u = new SpeechSynthesisUtterance(textToSpeak);
                u.lang = 'ja-JP';
                u.rate = parseFloat(document.getElementById('speech-rate-select').value) || 1.0;
                u.onboundary = (event) => {
                    this.state.lastSpeechIndex = (currentFullText.length - textToSpeak.length) + event.charIndex;
                };
                u.onend = () => {
                    this.state.isSpeaking = false;
                    this.speechBtn.textContent = "▶ 読上";
                    this.state.lastSpeechIndex = 0;
                    if (this.resumeTimer) { clearInterval(this.resumeTimer); this.resumeTimer = null; }
                };
                window.speechSynthesis.speak(u);
                this.state.isSpeaking = true;
                this.speechBtn.textContent = "⏹ 中断";
                if (this.resumeTimer) clearInterval(this.resumeTimer);
                this.resumeTimer = setInterval(() => {
                    if (!this.state.isSpeaking) { clearInterval(this.resumeTimer); return; }
                    if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
                }, 10000); 
            }
        }
        window.onload = () => { 
            const tool = new MushikuiToolV5();
            tool.init();
        };
    </script>
</body>
