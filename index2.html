<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虫食 v6.0.4 (Drive Sync)</title>
    <style>
        :root {
            --bg-color: #f8fafc; --main-bg: #ffffff;
            --text-color: #1e293b; --border-color: #cbd5e0;
            --header-bg: #0f172a; --header-text: #ffffff;
            --button-bg: #334155; --button-hover-bg: #1e293b;
            --highlight-bg: #fffde7; --toolbar-bg: #f1f5f9;
            --accent-blue: #2563eb; --accent-green: #059669;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; height: 100vh; width: 100vw;
        }
        #app-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
        header {
            background-color: var(--header-bg); color: var(--header-text);
            padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 54px;
        }
        .doc-controls { display: flex; flex-grow: 1; gap: 6px; align-items: center; overflow: hidden; }
        select#doc-select {
            flex-grow: 1; height: 38px; font-size: 16px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; min-width: 80px;
        }
        button.icon-btn {
            height: 38px; width: 42px; display: flex; justify-content: center; align-items: center;
            background-color: var(--button-bg); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0;
        }
        button.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .meta-info { text-align: right; line-height: 1.2; margin-left: auto; display: flex; flex-direction: column; justify-content: center; min-width: 80px; }
        #char-counter { font-size: 10px; color: #ffffff; font-weight: bold; white-space: nowrap; }
        #sync-status { font-size: 8px; color: #94a3b8; white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
        
        #toolbar-container {
            background-color: var(--toolbar-bg); padding: 8px; border-bottom: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .action-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .action-btn {
            background: #fff; border: 1px solid #cbd5e0; color: #334155;
            font-size: 13px; padding: 0 12px; border-radius: 6px; cursor: pointer; height: 36px; white-space: nowrap;
            transition: all 0.2s; flex-shrink: 0;
        }
        .marker-scroll-row { 
            display: flex; gap: 10px; overflow-x: auto; padding: 4px 0; 
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .palette-btn {
            width: 44px; height: 42px; flex-shrink: 0; border-radius: 8px; cursor: pointer; 
            border: 2px solid rgba(0,0,0,0.15); box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        main { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; position: relative; background: var(--main-bg); }
        #main-text-area {
            flex-grow: 1; padding: 20px; font-size: 18px; line-height: 1.8;
            white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; outline: none;
            -webkit-user-modify: read-write-plaintext-only;
        }
        #main-text-area:empty::before { content: "初期化中..."; color: #94a3b8; }
        
        .marker { 
            cursor: pointer; border-radius: 2px; user-select: none; transition: all 0.2s; padding: 0 2px; margin: 0 1px;
            display: inline-block; line-height: 1.2; border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .marker[data-color="red"] { background-color: #ef4444; color: #ef4444; }
        .marker[data-color="orange"] { background-color: #f97316; color: #f97316; }
        .marker[data-color="yellow"] { background-color: #eab308; color: #eab308; }
        .marker[data-color="green"] { background-color: #22c55e; color: #22c55e; }
        .marker[data-color="blue"] { background-color: #3b82f6; color: #3b82f6; }
        .marker[data-color="purple"] { background-color: #a855f7; color: #a855f7; }
        .marker.reveal { background-color: var(--highlight-bg) !important; color: var(--text-color) !important; border-bottom: 2px solid transparent; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 9999; display: none; justify-content: center; align-items: center;
        }
        .modal-content { 
            background: #fff; width: 92%; max-width: 400px; border-radius: 12px; padding: 24px; 
            display: flex; flex-direction: column; gap: 16px; 
        }
        #rename-input {
            width: 100%; height: 44px; border: 1px solid #cbd5e0; border-radius: 8px; 
            padding: 0 12px; font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <header>
            <div class="doc-controls">
                <select id="doc-select"></select>
                <button id="rename-doc-btn" class="icon-btn">✎</button>
                <button id="auth-btn" class="icon-btn" style="background:var(--accent-blue)" disabled title="Loading...">G</button>
                <button id="sync-all-btn" class="icon-btn" style="background:var(--accent-green)">↻</button>
            </div>
            <div class="meta-info">
                <div id="char-counter">0文字</div>
                <div id="sync-status">Booting...</div>
            </div>
        </header>

        <div id="toolbar-container">
            <div class="action-row">
                <button class="action-btn" id="paste-btn">📋 貼付</button>
                <button class="action-btn" id="speech-btn" style="border-color: #3b82f6; color: #2563eb;">▶ 読上</button>
                <select id="speech-rate-select" class="action-btn">
                    <option value="0.8">0.8x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.5">1.5x</option>
                </select>
                <button class="action-btn" id="copy-btn">📄 複写</button>
                <label class="action-btn" style="margin-left:auto; display:flex; align-items:center; gap:4px;">
                    <input type="checkbox" id="toggle-markers-cb" checked> 隠
                </label>
            </div>
            <div class="marker-scroll-row" id="marker-palette"></div>
        </div>

        <main>
            <div id="main-text-area" contenteditable="true" spellcheck="false"></div>
        </main>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0;">文書名を変更</h3>
            <input type="text" id="rename-input">
            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button class="action-btn" id="modal-ok-btn" style="background:var(--accent-blue); color:white; border:none;">決定</button>
                <button class="action-btn" id="modal-cancel-btn">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Script Loading Manager -->
    <script>
        const CLIENT_ID = '221098146252-psmtjk7chc54n35tpp4jgr3sgbipsemn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        const FOLDER_NAME = 'MarKer';

        let gapiInited = false;
        let gisInited = false;

        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                const btn = document.getElementById('auth-btn');
                if (btn) {
                    btn.disabled = false;
                    btn.title = "Google Drive Syncを開始";
                }
                const status = document.getElementById('sync-status');
                if (status && status.innerText === "Booting...") status.innerText = "Ready";
            }
        }

        // Global Error Handler to prevent reload loops
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Caught Global Error:', msg, error);
            const status = document.getElementById('sync-status');
            if (status) status.innerText = "Script Error";
            return true; // Stop propagation
        };
    </script>
    <script src="https://accounts.google.com/gsi/client" onload="gisInited = true; maybeEnableButtons();"></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiInited = true; maybeEnableButtons();"></script>

    <script type="module">
        class MushikuiDriveApp {
            constructor() {
                const localData = localStorage.getItem('mushikui_drive_v6');
                this.state = {
                    documents: localData ? JSON.parse(localData) : Array.from({length:20}, (_,i)=>({title:`文書 ${i+1}`, content:'', rules:''})),
                    currentIndex: 0,
                    accessToken: null,
                    folderId: null,
                    fileIds: {}, 
                    isSaving: false
                };
                this.colors = [
                    { id: 'red', code: '#ef4444' }, { id: 'orange', code: '#f97316' },
                    { id: 'yellow', code: '#eab308' }, { id: 'green', code: '#22c55e' },
                    { id: 'blue', code: '#3b82f6' }, { id: 'purple', code: '#a855f7' }
                ];
                this.tokenClient = null;
                this.isSpeaking = false;
                this.lastTapTime = 0;
                this.lastTapTarget = null;
            }

            async init() {
                this.editor = document.getElementById('main-text-area');
                this.docSelect = document.getElementById('doc-select');
                this.syncStatus = document.getElementById('sync-status');
                
                this.renderPalette();
                this.bindEvents();
                this.updateMeta();
                this.refresh();

                // Initialize GAPI
                try {
                    window.gapi.load('client', async () => {
                        await window.gapi.client.init({});
                        await window.gapi.client.load('drive', 'v3');
                        this.showStatus("GAPI Ready");
                    });

                    this.tokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: CLIENT_ID,
                        scope: SCOPES,
                        callback: (resp) => this.handleAuthResponse(resp),
                    });
                } catch (e) {
                    this.showStatus("Init Failure");
                }
            }

            async handleAuthResponse(resp) {
                if (resp.error) {
                    this.showStatus("Auth: " + resp.error);
                    return;
                }
                this.state.accessToken = resp.access_token;
                this.showStatus("Auth OK");
                await this.initDriveFolder();
                await this.syncAllWithDrive();
            }

            async initDriveFolder() {
                try {
                    const q = `name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, {
                        headers: { Authorization: `Bearer ${this.state.accessToken}` }
                    });
                    const data = await res.json();
                    if (data.files?.length > 0) {
                        this.state.folderId = data.files[0].id;
                    } else {
                        const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                            method: 'POST',
                            headers: { Authorization: `Bearer ${this.state.accessToken}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
                        });
                        const folder = await createRes.json();
                        this.state.folderId = folder.id;
                    }
                } catch (e) { this.showStatus("Folder Err"); }
            }

            async syncAllWithDrive() {
                if (!this.state.folderId) return;
                this.showStatus("Syncing...");
                try {
                    const q = `'${this.state.folderId}' in parents and trashed=false`;
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, {
                        headers: { Authorization: `Bearer ${this.state.accessToken}` }
                    });
                    const data = await res.json();
                    
                    for (const file of data.files) {
                        const match = file.name.match(/^mushikui_doc_(\d+)\.json$/);
                        if (match) {
                            const idx = parseInt(match[1]);
                            this.state.fileIds[idx] = file.id;
                            const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
                                headers: { Authorization: `Bearer ${this.state.accessToken}` }
                            });
                            this.state.documents[idx] = await contentRes.json();
                        }
                    }
                    this.refresh();
                    this.showStatus("Drive Synced");
                } catch (e) { this.showStatus("Sync Err"); }
            }

            async saveCurrentToDrive() {
                if (!this.state.accessToken || !this.state.folderId || this.state.isSaving) return;
                this.state.isSaving = true;
                const idx = this.state.currentIndex;
                const fileId = this.state.fileIds[idx];
                const content = JSON.stringify(this.state.documents[idx]);

                try {
                    if (fileId) {
                        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                            method: 'PATCH',
                            headers: { Authorization: `Bearer ${this.state.accessToken}`, 'Content-Type': 'application/json' },
                            body: content
                        });
                    } else {
                        const metadata = { name: `mushikui_doc_${idx}.json`, parents: [this.state.folderId] };
                        const boundary = '-------';
                        const body = `--${boundary}\nContent-Type: application/json; charset=UTF-8\n\n${JSON.stringify(metadata)}\n--${boundary}\nContent-Type: application/json\n\n${content}\n--${boundary}--`;
                        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: { Authorization: `Bearer ${this.state.accessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
                            body: body
                        });
                        const newFile = await res.json();
                        this.state.fileIds[idx] = newFile.id;
                    }
                    this.showStatus("Cloud Saved");
                } catch(e) { this.showStatus("Save Err"); }
                this.state.isSaving = false;
            }

            createMarker(colorId) {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
                const range = sel.getRangeAt(0);
                const target = range.toString().trim();
                if (!target) return;

                const getCtx = (isPre) => {
                    const r = document.createRange();
                    if(isPre) { r.setStart(this.editor, 0); r.setEnd(range.startContainer, range.startOffset); }
                    else { r.setStart(range.endContainer, range.endOffset); r.setEnd(this.editor, this.editor.childNodes.length); }
                    const txt = r.cloneContents().textContent || "";
                    return isPre ? [...txt].slice(-4).join('') : [...txt].slice(0, 4).join('');
                };

                const rule = `${getCtx(true)}[SEP]${getCtx(false)}->${target}%%C${colorId}`;
                const doc = this.state.documents[this.state.currentIndex];
                const rs = (doc.rules || '').split('\n').filter(Boolean);
                rs.push(rule);
                doc.rules = rs.join('\n');
                this.refresh();
                this.autoSave();
                sel.removeAllRanges();
            }

            refresh() {
                const docData = this.state.documents[this.state.currentIndex];
                const raw = docData.content || '';
                this.editor.innerHTML = '';
                let nodes = [{ text: raw, type: 'text' }];
                const rules = (docData.rules || '').split('\n').filter(r => r.includes('->'));
                
                rules.forEach(rule => {
                    const [meta, body] = rule.split('->');
                    if (!body) return;
                    const [target, colorPart] = body.split('%%');
                    if (!target) return; // Infinite Loop Guard
                    
                    const colorId = colorPart ? colorPart.replace('C', '') : 'red';
                    const pre = meta ? meta.split('[SEP]')[0] : "";
                    const pattern = pre + target;
                    
                    if (!pattern) return; // Double Guard

                    for (let i = 0; i < nodes.length; i++) {
                        if (nodes[i].type === 'text') {
                            const idx = nodes[i].text.indexOf(pattern);
                            if (idx > -1) {
                                const start = idx + pre.length;
                                nodes.splice(i, 1, 
                                    { text: nodes[i].text.substring(0, start), type: 'text' },
                                    { text: target, type: 'marker', color: colorId, rule: rule },
                                    { text: nodes[i].text.substring(start + target.length), type: 'text' }
                                );
                                break;
                            }
                        }
                    }
                });

                nodes.forEach(n => {
                    if (n.type === 'text') {
                        n.text.split('\n').forEach((t, i, a) => {
                            if(t) this.editor.appendChild(document.createTextNode(t));
                            if(i < a.length - 1) this.editor.appendChild(document.createElement('br'));
                        });
                    } else {
                        const span = document.createElement('span');
                        span.className = 'marker';
                        span.dataset.rule = n.rule; span.dataset.color = n.color;
                        span.textContent = n.text; this.editor.appendChild(span);
                    }
                });
                this.updateCharCount();
                this.toggleVisibility(document.getElementById('toggle-markers-cb').checked);
            }

            bindEvents() {
                this.editor.addEventListener('input', () => {
                    this.state.documents[this.state.currentIndex].content = this.editor.innerText;
                    this.autoSave();
                });
                this.editor.addEventListener('click', (e) => {
                    const m = e.target.closest('.marker');
                    if (m) {
                        const now = Date.now();
                        if (now - this.lastTapTime < 350 && this.lastTapTarget === m) {
                            if(confirm("このマーカーを削除しますか？")) this.delRule(m.dataset.rule);
                            this.lastTapTime = 0;
                        } else {
                            m.classList.toggle('reveal');
                            this.lastTapTime = now;
                            this.lastTapTarget = m;
                        }
                    }
                });
                this.docSelect.addEventListener('change', (e) => {
                    this.state.currentIndex = parseInt(e.target.value);
                    this.refresh();
                });
                document.getElementById('auth-btn').onclick = () => {
                    if (this.tokenClient) this.tokenClient.requestAccessToken();
                };
                document.getElementById('sync-all-btn').onclick = () => this.syncAllWithDrive();
                document.getElementById('rename-doc-btn').onclick = () => this.openRename();
                document.getElementById('modal-ok-btn').onclick = () => this.applyRename();
                document.getElementById('modal-cancel-btn').onclick = () => document.getElementById('modal-overlay').style.display = 'none';
                document.getElementById('speech-btn').onclick = () => this.toggleSpeech();
                
                document.getElementById('copy-btn').onclick = () => {
                    const dummy = document.createElement("textarea");
                    document.body.appendChild(dummy);
                    dummy.value = this.editor.innerText;
                    dummy.select();
                    document.execCommand("copy");
                    document.body.removeChild(dummy);
                    this.showStatus("Copied");
                };

                document.getElementById('paste-btn').onclick = () => {
                    const text = prompt("テキストを入力：");
                    if (text !== null) {
                        this.editor.innerText = text;
                        this.state.documents[this.state.currentIndex].content = text;
                        this.autoSave();
                        this.refresh();
                    }
                };
            }

            delRule(ruleText) {
                const doc = this.state.documents[this.state.currentIndex];
                const rs = (doc.rules || '').split('\n').filter(r => r !== ruleText);
                doc.rules = rs.join('\n');
                this.refresh();
                this.autoSave();
            }

            autoSave() {
                this.persistLocal();
                this.updateCharCount();
                clearTimeout(this.saveTimer);
                this.saveTimer = setTimeout(() => this.saveCurrentToDrive(), 5000);
            }

            persistLocal() { localStorage.setItem('mushikui_drive_v6', JSON.stringify(this.state.documents)); }
            updateMeta() {
                this.docSelect.innerHTML = this.state.documents.map((d,i) => `<option value="${i}">${d.title}</option>`).join('');
                this.docSelect.value = this.state.currentIndex;
            }
            updateCharCount() { document.getElementById('char-counter').textContent = `${this.editor.innerText.length}文字`; }
            showStatus(msg) { if(this.syncStatus) this.syncStatus.textContent = msg; }

            renderPalette() {
                const p = document.getElementById('marker-palette');
                this.colors.forEach(c => {
                    const btn = document.createElement('div');
                    btn.className = 'palette-btn'; btn.style.backgroundColor = c.code;
                    btn.onpointerdown = (e) => { e.preventDefault(); this.createMarker(c.id); };
                    p.appendChild(btn);
                });
            }

            openRename() {
                const m = document.getElementById('modal-overlay');
                const input = document.getElementById('rename-input');
                input.value = this.state.documents[this.state.currentIndex].title;
                m.style.display = 'flex';
                input.focus();
            }

            applyRename() {
                this.state.documents[this.state.currentIndex].title = document.getElementById('rename-input').value;
                this.updateMeta();
                this.autoSave();
                document.getElementById('modal-overlay').style.display = 'none';
            }

            toggleVisibility(hide) {
                this.editor.querySelectorAll('.marker').forEach(m => {
                    if (hide) m.classList.remove('reveal'); else m.classList.add('reveal');
                });
            }

            toggleSpeech() {
                if (this.isSpeaking) { window.speechSynthesis.cancel(); this.isSpeaking = false; return; }
                const u = new SpeechSynthesisUtterance(this.editor.innerText);
                u.lang = 'ja-JP';
                u.rate = parseFloat(document.getElementById('speech-rate-select').value);
                u.onend = () => this.isSpeaking = false;
                window.speechSynthesis.speak(u);
                this.isSpeaking = true;
            }
        }

        window.addEventListener('load', () => {
            const app = new MushikuiDriveApp();
            app.init();
        });
    </script>
</body>
</html>
